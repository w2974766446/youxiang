# Render 部署配置（达人选品台 - 后端 + 前端同源托管）
# 单个 Web Service 同时运行 Express API 与托管 public/ 前端，同源无 CORS。
# 部署方式：把本项目推到 GitHub，在 Render 新建 Web Service 选此仓库，或用控制台"New > Web Service"。
# 凭据类变量标 sync:false，需在 Render 控制台 Environment 中手动填写（不会进入代码仓库）。
services:
  - type: web
    name: dps-selection-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/filters
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: ADMIN_PASS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: OUTPUT_DIR
        value: "data/exports"
